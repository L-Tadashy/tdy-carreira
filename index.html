<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDY_CARREIRA — Career Mode</title>
    
    <!-- Configurações para PWA / Mobile -->
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TDY_CARREIRA">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap');
        .font-teko { font-family: 'Teko', sans-serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        .glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }
        .glow-card { box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12 selection:bg-emerald-500 selection:text-slate-950">

    <!-- Navbar Estilo Pro-Gaming -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg font-black text-xl flex items-center justify-center w-10 h-10 glow-emerald">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-teko uppercase tracking-wider text-white leading-none">TDY<span class="text-emerald-400">_CARREIRA</span></h1>
                    <p class="text-xs text-slate-400 font-semibold tracking-widest uppercase">Career Simulator</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="bg-slate-800 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ONLINE
                </span>
            </div>
        </div>
    </header>

    <!-- Content Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 pt-6 space-y-6">

        <!-- Banner do Jogador estilo FUT Card -->
        <section class="bg-gradient-to-r from-slate-900 via-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-6 glow-card relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 opacity-10 text-emerald-500 text-9xl font-black pointer-events-none font-teko">
                TDY
            </div>
            <div class="flex flex-col md:flex-row items-center justify-between gap-6 relative z-10">
                <div class="flex flex-col md:flex-row items-center gap-6 text-center md:text-left">
                    <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-4xl font-black text-slate-950 glow-emerald shadow-lg">
                        92
                    </div>
                    <div>
                        <div class="inline-block bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-2.5 py-0.5 rounded uppercase tracking-wider mb-1">
                            Avançado Centro
                        </div>
                        <h2 class="text-4xl font-teko font-bold uppercase tracking-wide text-white">Lucas "Tadashy"</h2>
                        <p class="text-slate-400 text-sm flex items-center justify-center md:justify-start gap-2">
                            <i class="fa-solid fa-shield-halved text-emerald-400"></i> Época Atual: <span class="text-white font-semibold">2026/27</span>
                        </p>
                    </div>
                </div>

                <!-- Atributos Chave -->
                <div class="grid grid-cols-3 gap-3 w-full md:w-auto">
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl text-center min-w-[90px]">
                        <span class="text-xs text-slate-400 block font-semibold uppercase">Ritmo</span>
                        <span class="text-2xl font-teko font-bold text-emerald-400">94</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl text-center min-w-[90px]">
                        <span class="text-xs text-slate-400 block font-semibold uppercase">Remate</span>
                        <span class="text-2xl font-teko font-bold text-emerald-400">91</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl text-center min-w-[90px]">
                        <span class="text-xs text-slate-400 block font-semibold uppercase">Passe</span>
                        <span class="text-2xl font-teko font-bold text-emerald-400">86</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Métricas Rápidas -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-bold uppercase">Jogos</span>
                    <i class="fa-solid fa-shirt text-emerald-400"></i>
                </div>
                <p class="text-3xl font-teko font-bold text-white">38</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-bold uppercase">Golos</span>
                    <i class="fa-solid fa-futbol text-emerald-400"></i>
                </div>
                <p class="text-3xl font-teko font-bold text-white">34</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-bold uppercase">Assistências</span>
                    <i class="fa-solid fa-handshake text-emerald-400"></i>
                </div>
                <p class="text-3xl font-teko font-bold text-white">12</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-bold uppercase">Classificação</span>
                    <i class="fa-solid fa-star text-amber-400"></i>
                </div>
                <p class="text-3xl font-teko font-bold text-amber-400">8.9</p>
            </div>
        </section>

        <!-- Gráfico e Estatísticas Secundárias -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Gráfico de Desempenho -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <h3 class="text-xl font-teko font-bold text-white uppercase mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-emerald-400"></i> Evolução de Golos / Época
                </h3>
                <div class="relative h-64 w-full">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>

            <!-- Evolução de Atributos -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-teko font-bold text-white uppercase mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-emerald-400"></i> Atributos Físicos
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1">
                                <span class="text-slate-400">RESISTÊNCIA</span>
                                <span class="text-emerald-400">88%</span>
                            </div>
                            <div class="w-full bg-slate-950 rounded-full h-2">
                                <div class="bg-emerald-500 h-2 rounded-full" style="width: 88%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1">
                                <span class="text-slate-400">FORÇA</span>
                                <span class="text-emerald-400">82%</span>
                            </div>
                            <div class="w-full bg-slate-950 rounded-full h-2">
                                <div class="bg-emerald-500 h-2 rounded-full" style="width: 82%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1">
                                <span class="text-slate-400">AGILIDADE</span>
                                <span class="text-emerald-400">90%</span>
                            </div>
                            <div class="w-full bg-slate-950 rounded-full h-2">
                                <div class="bg-emerald-500 h-2 rounded-full" style="width: 90%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
                    <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition duration-200 uppercase tracking-wider text-sm glow-emerald">
                        <i class="fa-solid fa-play mr-1"></i> Simular Próximo Jogo
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Script Chart.js -->
    <script>
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['23/24', '24/25', '25/26', '26/27'],
                datasets: [{
                    label: 'Golos Marcados',
                    data: [12, 21, 28, 34],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#10b981',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8' }
                    }
                }
            }
        });
    </script>
</body>
</html>
